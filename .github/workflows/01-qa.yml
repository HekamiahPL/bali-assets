name: 01 QA Bali PWA

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/01-qa.yml"

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and check JavaScript from index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>",html,flags=re.I)
          if not scripts:
              raise SystemExit("No script blocks found")
          Path("/tmp/pwa-index.js").write_text("\n".join(scripts),encoding="utf-8")
          print("script blocks:",len(scripts))
          PY
          node --check /tmp/pwa-index.js

      - name: Check service worker syntax
        run: node --check sw.js

      - name: Validate manifest JSON
        run: python3 -m json.tool manifest.webmanifest > /dev/null

      - name: Check required PWA features
        shell: bash
        run: |
          grep -q "apple-touch-icon" index.html
          grep -q "manifest.webmanifest" index.html
          grep -Eq "standalone-pwa-v[0-9]+" index.html
          grep -q "bali2026_apps_script_exec_url" index.html
          grep -q "CANONICAL_BACKEND_URL" index.html
          grep -q "resetBackendConnection_" index.html
          grep -q "__baliJsonp_" index.html
          grep -q "initBottomNavigation_" index.html
          grep -q "serviceWorker" index.html
          grep -q "\.register" index.html
          if grep -q "<iframe" index.html; then
            echo "Standalone PWA must not depend on iframe UI"
            exit 1
          fi
          if grep -q "google.script.run" index.html; then
            echo "Standalone PWA must not depend on google.script.run"
            exit 1
          fi
          grep -Eq "bali-2026-shell-v[0-9]+" sw.js
          grep -q "live-data.json" index.html
          grep -q "editChecklistModal" index.html
          grep -q "saveChecklistEdit" index.html
          grep -q "deleteChecklist" index.html
          grep -q "updateChecklistItem" index.html
          grep -q "deleteChecklistItem" index.html
          echo "Standalone PWA startup and sanity checks passed"
