<!doctype html>

<html lang="pl">
<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS / PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bali 2026">
  <meta name="theme-color" content="#F4F1E9">
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- IKONA ŻÓŁWIKA -->
<link rel="apple-touch-icon"
      sizes="180x180"
      href="./logo-180.png">

<meta name="apple-mobile-web-app-title" content="Bali 2026">
<meta name="apple-mobile-web-app-capable" content="yes">

  <title>Bali 2026</title>

  <style>
    :root {
      --bg:#F4F1E9;
      --card:#FFFFFF;
      --ink:#17211B;
      --muted:#68736C;
      --accent:#1D6B52;
      --accent-soft:#DCEBE4;
      --sand:#EAD8B5;
      --warning:#8A5A00;
      --warning-bg:#FFF0CB;
      --line:#E4E7E3;
      --shadow:0 10px 30px rgba(23,33,27,.08);
      --radius:22px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#101512;
        --card:#18201C;
        --ink:#F3F7F4;
        --muted:#A7B1AA;
        --accent:#5CC89B;
        --accent-soft:#203A30;
        --sand:#4B3C26;
        --warning:#FFD37A;
        --warning-bg:#3F3118;
        --line:#2A342E;
        --shadow:0 10px 30px rgba(0,0,0,.26);
      }
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
    }

    body {
      padding-bottom:calc(90px + env(safe-area-inset-bottom));
    }

    button,
    input,
    textarea,
    select {
      font:inherit;
    }

    .app {
      max-width:680px;
      margin:0 auto;
      min-height:100vh;
    }

    .topbar {
      position:sticky;
      top:0;
      z-index:20;
      backdrop-filter:blur(18px);
      background:color-mix(in srgb, var(--bg) 84%, transparent);
      padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
      border-bottom:1px solid color-mix(in srgb, var(--line) 70%, transparent);
    }

    .brandrow {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    h1 {
      font-size:28px;
      line-height:1;
      margin:0;
      letter-spacing:-.8px;
    }

    .sub {
      color:var(--muted);
      font-size:13px;
      margin-top:6px;
    }

    .iconbtn {
      border:0;
      background:var(--card);
      color:var(--ink);
      width:42px;
      height:42px;
      border-radius:14px;
      box-shadow:var(--shadow);
      font-size:19px;
    }

    main {
      padding:18px;
    }

    .hero {
      background:linear-gradient(145deg,var(--accent-soft),var(--card));
      border:1px solid var(--line);
      border-radius:28px;
      padding:20px;
      box-shadow:var(--shadow);
      margin-bottom:16px;
    }

    .eyebrow {
      text-transform:uppercase;
      letter-spacing:.12em;
      font-size:11px;
      font-weight:800;
      color:var(--accent);
    }

    .hero h2 {
      font-size:28px;
      margin:7px 0 6px;
      letter-spacing:-.6px;
    }

    .hero p {
      margin:0;
      color:var(--muted);
      line-height:1.45;
    }

    .chips {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .chip {
      background:var(--card);
      border:1px solid var(--line);
      padding:8px 11px;
      border-radius:999px;
      font-size:12px;
      font-weight:650;
    }

    .section-title {
      font-size:18px;
      margin:22px 2px 10px;
      letter-spacing:-.3px;
    }

    .card {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:16px;
      margin-bottom:12px;
      box-shadow:var(--shadow);
    }

    .date-row {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .daybadge {
      font-size:11px;
      font-weight:800;
      color:var(--accent);
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .date {
      font-weight:800;
      font-size:17px;
      margin-top:3px;
    }

    .plan {
      white-space:pre-line;
      color:var(--ink);
      line-height:1.5;
      font-size:14px;
      margin-top:13px;
    }

    .hotel {
      margin-top:14px;
      padding-top:12px;
      border-top:1px solid var(--line);
    }

    .hotel strong {
      display:block;
      font-size:14px;
    }

    .muted {
      color:var(--muted);
    }

    .actions {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .btn {
      border:0;
      border-radius:14px;
      padding:11px 13px;
      font-weight:750;
      background:var(--accent);
      color:white;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      min-height:42px;
    }

    .btn.secondary {
      background:var(--accent-soft);
      color:var(--accent);
    }

    .btn.ghost {
      background:transparent;
      color:var(--ink);
      border:1px solid var(--line);
    }

    .btn.small {
      padding:8px 10px;
      min-height:34px;
      font-size:12px;
    }

    .progress {
      height:9px;
      background:var(--line);
      border-radius:999px;
      overflow:hidden;
      margin-top:10px;
    }

    .progress > span {
      display:block;
      height:100%;
      background:var(--accent);
      border-radius:999px;
    }

    .checkrow {
      display:flex;
      gap:12px;
      align-items:flex-start;
      padding:13px 0;
      border-bottom:1px solid var(--line);
    }

    .checkrow:last-child {
      border-bottom:0;
    }

    .checkrow input {
      width:22px;
      height:22px;
      accent-color:var(--accent);
      margin-top:1px;
    }

    .checktitle {
      font-weight:700;
      font-size:14px;
      line-height:1.35;
    }

    .checkmeta {
      color:var(--muted);
      font-size:12px;
      margin-top:4px;
    }

    .done .checktitle {
      text-decoration:line-through;
      opacity:.55;
    }

    .transport {
      background:var(--accent-soft);
      border-radius:16px;
      padding:12px;
      margin-top:12px;
      font-size:13px;
      line-height:1.45;
      white-space:pre-line;
    }

    .warning {
      background:var(--warning-bg);
      color:var(--warning);
      border-radius:16px;
      padding:12px;
      font-size:13px;
      margin:10px 0;
    }

    .empty {
      text-align:center;
      color:var(--muted);
      padding:36px 12px;
    }

    .bottomnav {
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:0;
      z-index:30;
      width:min(680px,100%);
      display:grid;
      grid-template-columns:repeat(6,1fr);
      border-top:1px solid var(--line);
      background:color-mix(in srgb,var(--card) 92%,transparent);
      backdrop-filter:blur(20px);
      padding:7px 6px calc(7px + env(safe-area-inset-bottom));
    }

    .navbtn {
      border:0;
      background:transparent;
      color:var(--muted);
      padding:7px 2px;
      font-size:10px;
      font-weight:700;
      cursor:pointer;
      touch-action:manipulation;
      pointer-events:auto;
      -webkit-user-select:none;
      user-select:none;
    }

    .navbtn span {
      display:block;
      font-size:20px;
      margin-bottom:2px;
    }

    .navbtn.active {
      color:var(--accent);
    }

    .field {
      margin-bottom:12px;
    }

    .field label {
      display:block;
      font-weight:700;
      font-size:12px;
      margin-bottom:6px;
    }

    textarea,
    input,
    select {
      width:100%;
      border:1px solid var(--line);
      background:var(--card);
      color:var(--ink);
      border-radius:14px;
      padding:12px;
      outline:none;
    }

    textarea {
      min-height:105px;
      resize:vertical;
    }

    .plan-route-sticky {
      position:sticky;
      top:calc(72px + env(safe-area-inset-top));
      z-index:16;
      margin:-2px -18px 16px;
      padding:10px 12px 12px;
      background:color-mix(in srgb,var(--bg) 94%,transparent);
      backdrop-filter:blur(18px);
      border-top:1px solid color-mix(in srgb,var(--line) 65%,transparent);
      border-bottom:1px solid var(--line);
    }

    .plan-route-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:0 4px 8px;
    }

    .plan-route-title {
      font-size:12px;
      font-weight:800;
      color:var(--ink);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .plan-route-hint {
      font-size:10px;
      color:var(--muted);
      white-space:nowrap;
    }

    .plan-route-track {
      display:flex;
      gap:7px;
      overflow-x:auto;
      overscroll-behavior-x:contain;
      scrollbar-width:none;
      padding:2px 4px 3px;
      scroll-snap-type:x proximity;
    }

    .plan-route-track::-webkit-scrollbar {
      display:none;
    }

    .route-day {
      flex:0 0 auto;
      min-width:42px;
      height:42px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--card);
      color:var(--muted);
      font-size:11px;
      font-weight:850;
      padding:0 8px;
      scroll-snap-align:center;
      box-shadow:0 4px 12px rgba(23,33,27,.04);
    }

    .route-day.active {
      background:var(--accent);
      color:#fff;
      border-color:var(--accent);
      transform:translateY(-1px);
    }

    .route-day.today {
      box-shadow:0 0 0 2px var(--sand);
    }

    .weather-card {
      background:linear-gradient(145deg,var(--card),var(--accent-soft));
      border:1px solid var(--line);
      border-radius:22px;
      padding:16px;
      margin-bottom:16px;
      box-shadow:var(--shadow);
    }

    .weather-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .weather-box {
      background:color-mix(in srgb,var(--card) 88%,transparent);
      border:1px solid var(--line);
      border-radius:16px;
      padding:13px;
    }

    .weather-icon {
      font-size:28px;
      line-height:1;
      margin-bottom:7px;
    }

    .weather-temp {
      font-size:24px;
      font-weight:850;
      letter-spacing:-.5px;
    }

    .weather-label {
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
      line-height:1.35;
    }

    .money-total {
      font-size:34px;
      font-weight:850;
      letter-spacing:-1px;
      margin-top:7px;
    }

    .costrow {
      padding:13px 0;
      border-bottom:1px solid var(--line);
    }

    .costrow:last-child {
      border-bottom:0;
    }

    .costtop {
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }

    .costname {
      font-weight:750;
      font-size:14px;
      line-height:1.35;
    }

    .costamount {
      font-weight:850;
      text-align:right;
      white-space:nowrap;
    }

    .costpln {
      color:var(--accent);
      font-size:12px;
      font-weight:750;
      margin-top:3px;
      text-align:right;
    }

    .converter-result {
      margin-top:12px;
      padding:16px;
      border-radius:18px;
      background:var(--accent-soft);
      color:var(--accent);
    }

    .conversion-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .conversion-box {
      background:var(--card);
      border:1px solid color-mix(in srgb,var(--accent) 20%,var(--line));
      border-radius:14px;
      padding:12px;
    }

    .conversion-code {
      font-size:11px;
      font-weight:850;
      letter-spacing:.08em;
      color:var(--muted);
      text-transform:uppercase;
    }

    .conversion-value {
      margin-top:4px;
      font-size:19px;
      font-weight:850;
      line-height:1.15;
      color:var(--ink);
      word-break:break-word;
    }

    .two-fields {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .modalback {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.35);
      z-index:50;
      display:none;
      align-items:flex-end;
      justify-content:center;
    }

    .modalback.show {
      display:flex;
    }

    .sheetmodal {
      width:min(680px,100%);
      max-height:86vh;
      overflow:auto;
      background:var(--bg);
      border-radius:26px 26px 0 0;
      padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    }

    .handle {
      width:44px;
      height:5px;
      border-radius:99px;
      background:var(--line);
      margin:0 auto 16px;
    }

    .loading {
      padding:70px 20px;
      text-align:center;
      color:var(--muted);
    }

    .spinner {
      width:28px;
      height:28px;
      border:3px solid var(--line);
      border-top-color:var(--accent);
      border-radius:50%;
      margin:0 auto 14px;
      animation:spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform:rotate(360deg)
      }
    }
  </style>

const BACKEND_STORAGE_KEY =
  'bali2026_apps_script_exec_url';

// Jeden aktualny backend produkcyjny.
// Na urządzeniu zapisujemy prywatny klucz użytkownika, ale nie polegamy
// już na starym deployment ID, który mógł zostać zapisany wcześniej.
const CANONICAL_BACKEND_URL =
  'https://script.google.com/macros/s/AKfycbydVtIrXLkpuVkdSXQoj19BIo4fDhvri6HYlykIPvgEzEcBT4I4zhDT4rkbMDfStM442g/exec';

let BACKEND_URL = '';
let ACCESS_KEY = '';

function bootstrapAccessKeyFromUrl_() {

  try {

    const current =
      new URL(
        window.location.href
      );

    const key =
      String(
        current.searchParams.get('key') || ''
      ).trim();

    if (!key) {
      return false;
    }

    localStorage.setItem(
      BACKEND_STORAGE_KEY,
      CANONICAL_BACKEND_URL +
      '?key=' +
      encodeURIComponent(key)
    );

    // Klucz służy tylko do sparowania urządzenia.
    // Usuwamy go od razu z paska adresu i historii przeglądarki.
    current.searchParams.delete('key');

    history.replaceState(
      null,
      '',
      current.pathname +
      (current.searchParams.toString()
        ? '?' + current.searchParams.toString()
        : '') +
      current.hash
    );

    return true;

  } catch(e) {
    return false;
  }

}

bootstrapAccessKeyFromUrl_();

function loadBackendConfig_() {

  const raw =
    localStorage.getItem(
      BACKEND_STORAGE_KEY
    ) || '';

  try {

    const url =
      new URL(raw);

    if (
      url.protocol !== 'https:' ||
      url.hostname !== 'script.google.com' ||
      !/\/macros\/s\/.+\/exec\/?$/
        .test(url.pathname)
    ) {
      return false;
    }

    ACCESS_KEY =
      String(
        url.searchParams.get('key') || ''
      ).trim();

    if (!ACCESS_KEY) {
      return false;
    }

    // Samonaprawa: nawet jeśli Kasia/Dawid mają zapisany stary adres
    // deploymentu Apps Script, używamy bieżącego produkcyjnego backendu.
    BACKEND_URL =
      CANONICAL_BACKEND_URL;

    const canonicalStored =
      CANONICAL_BACKEND_URL +
      '?key=' +
      encodeURIComponent(
        ACCESS_KEY
      );

    if (raw !== canonicalStored) {
      localStorage.setItem(
        BACKEND_STORAGE_KEY,
        canonicalStored
      );
    }

    return true;

  } catch(e) {

    BACKEND_URL = '';
    ACCESS_KEY = '';

    return false;

  }

}

loadBackendConfig_();

let APP = {
  trip:[],
  checklist:[],
  costs:[],
  documents:[],
  places:[],
  emergency:[],
  currencyRates:null,
  weather:null,
  accessPerson:'',
  nowBali:null
};

const OFFLINE_KEY = 'bali2026_offline_snapshot_v3';
let APP_OFFLINE = false;

const allowedTabs = ['today','plan','checklist','transport','costs','more'];
const requestedTab = new URLSearchParams(window.location.search).get('tab');
let currentTab = allowedTabs.includes(requestedTab) ? requestedTab : 'today';


function esc(s='') {

  return String(s).replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[c])
  );

}


function nl(s='') {

  return esc(s).replace(/\n/g,'<br>');

}


function api(name, ...args) {

  return new Promise(
    (resolve,reject) => {

      if (
        !BACKEND_URL ||
        !ACCESS_KEY
      ) {

        reject(
          new Error(
            'Brak konfiguracji połączenia z Google Apps Script.'
          )
        );

        return;

      }

      const callback =
        '__baliJsonp_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);

      const script =
        document.createElement(
          'script'
        );

      const cleanup =
        () => {

          try {
            delete window[callback];
          } catch(e) {
            window[callback] =
              undefined;
          }

          script.remove();

        };

      const timer =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                'Google Sheets odpowiada zbyt długo.'
              )
            );

          },
          20000
        );

      window[callback] =
        payload => {

          clearTimeout(timer);
          cleanup();

          if (
            payload &&
            payload.ok
          ) {

            resolve(
              payload.result
            );

          } else {

            reject(
              new Error(
                payload &&
                payload.error
                  ? payload.error
                  : 'Błąd API.'
              )
            );

          }

        };

      script.onerror =
        () => {

          clearTimeout(timer);
          cleanup();

          reject(
            new Error(
              'Nie udało się połączyć z backendem podróży.'
            )
          );

        };

      const url =
        new URL(
          BACKEND_URL
        );

      url.searchParams.set(
        'api',
        '1'
      );

      url.searchParams.set(
        'action',
        name
      );

      url.searchParams.set(
        'key',
        ACCESS_KEY
      );

      url.searchParams.set(
        'args',
        JSON.stringify(args)
      );

      url.searchParams.set(
        'callback',
        callback
      );

      url.searchParams.set(
        '_',
        String(Date.now())
      );

      script.src =
        url.toString();

      script.async =
        true;

      document.head
        .appendChild(script);

    }
  );

}


function showBackendSetup_() {

  showModal(
    `<h2>Połącz aplikację</h2>

      <p class="muted">
        Wklej prywatny adres Google Apps Script kończący się na
        <b>/exec?key=…</b>. Adres zostanie zapisany tylko na tym urządzeniu.
      </p>

      <div class="field">
        <label>Adres backendu</label>
        <input
          id="backendSetupUrl"
          type="url"
          autocomplete="off"
          placeholder="https://script.google.com/macros/s/…/exec?key=…">
      </div>

      <div class="actions">
        <button
          class="btn"
          type="button"
          id="backendSetupSave">
          Połącz
        </button>
      </div>`
  );

  const save =
    document.getElementById(
      'backendSetupSave'
    );

  if (!save) {
    return;
  }

  save.addEventListener(
    'click',
    () => {

      const input =
        document.getElementById(
          'backendSetupUrl'
        );

      const value =
        String(
          input ? input.value : ''
        ).trim();

      try {

        const url =
          new URL(value);

        const key =
          String(
            url.searchParams.get('key') || ''
          ).trim();

        if (
          url.protocol !== 'https:' ||
          url.hostname !== 'script.google.com' ||
          !/\/macros\/s\/.+\/exec\/?$/
            .test(url.pathname) ||
          !key
        ) {
          throw new Error();
        }

        localStorage.setItem(
          BACKEND_STORAGE_KEY,
          value
        );

        location.reload();

      } catch(e) {

        alert(
          'Wklej poprawny prywatny adres aplikacji Apps Script.'
        );

      }

    }
  );

}


function resetBackendConnection_() {

  try {
    localStorage.removeItem(
      BACKEND_STORAGE_KEY
    );
  } catch(e) {}

  BACKEND_URL = '';
  ACCESS_KEY = '';

  showBackendSetup_();

}


function migrateLegacySnapshot_() {

  try {

    if (
      localStorage.getItem(
        OFFLINE_KEY
      )
    ) {
      return;
    }

    const legacy =
      localStorage.getItem(
        'bali2026_parent_snapshot_v1'
      );

    if (legacy) {
      localStorage.setItem(

      );
    }

}

function weatherCodeInfoClient_(code) {

  const c = Number(code);

  if (c === 0) {
    return { label:'Bezchmurnie', icon:'☀️' };
  }

  if ([1,2].includes(c)) {
    return { label:'Częściowe zachmurzenie', icon:'🌤️' };
  }

  if (c === 3) {
    return { label:'Pochmurno', icon:'☁️' };
  }

  if ([45,48].includes(c)) {
    return { label:'Mgła', icon:'🌫️' };
  }

  if ([51,53,55,56,57].includes(c)) {
    return { label:'Mżawka', icon:'🌦️' };
  }

  if ([61,63,65,66,67,80,81,82].includes(c)) {
    return { label:'Deszcz', icon:'🌧️' };
  }

  if ([95,96,99].includes(c)) {
    return { label:'Burze', icon:'⛈️' };
  }

  return { label:'Zmienne warunki', icon:'🌤️' };

}


async function fetchJson_(url, timeoutMs=6500) {

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      timeoutMs
    );

  try {

    const response =
      await fetch(
        url,
        {
          method:'GET',
          mode:'cors',
          cache:'no-store',
          signal:controller.signal,
          headers:{
            'Accept':'application/json'
          }
        }
      );

    if (!response.ok) {
      throw new Error(
        'HTTP ' + response.status
      );
    }

    return await response.json();

  } finally {

    clearTimeout(timer);

  }

}


async function loadLiveCurrency_() {

  const supported =
    [
      'PLN',
      'IDR',
      'EUR',
      'USD',
      'GBP',
      'TRY',
      'SGD',
      'AUD'
    ];

  // Provider 1: Frankfurter (bez klucza).
  try {

    const data =
      await fetchJson_(
        'https://api.frankfurter.dev/v1/latest' +
        '?base=PLN' +
        '&symbols=IDR,EUR,USD,GBP,TRY,SGD,AUD'
      );

    if (
      data &&
      data.rates
    ) {

      const rates = {
        PLN:{ rate:1, unit:1 }
      };

      supported
        .filter(code => code !== 'PLN')
        .forEach(
          code => {

            const value =
              Number(
                data.rates[code]
              );

            if (
              Number.isFinite(value) &&
              value > 0
            ) {
              rates[code] = {
                rate:value,
                unit:1
              };
            }

          }
        );

      if (
        rates.IDR &&
        rates.EUR &&
        rates.USD
      ) {

        APP.currencyRates = {
          date:data.date || '',
          nextUpdate:'',
          source:'Frankfurter',
          base:'PLN',
          rates
        };

        return true;

      }

    }

  } catch(e) {}


  // Provider 2: ExchangeRate-API jako zapasowy.
  try {

    const data =
      await fetchJson_(
        'https://open.er-api.com/v6/latest/PLN'
      );

    if (
      data &&
      data.result === 'success' &&
      data.rates
    ) {

      const rates = {};

      supported.forEach(
        code => {

          const value =
            code === 'PLN'
              ? 1
              : Number(
                  data.rates[code]
                );

          if (
            Number.isFinite(value) &&
            value > 0
          ) {
            rates[code] = {
              rate:value,
              unit:1
            };
          }

        }
      );

      if (
        rates.IDR &&
        rates.EUR &&
        rates.USD
      ) {

        APP.currencyRates = {
          date:
            data.time_last_update_utc || '',
          nextUpdate:
            data.time_next_update_utc || '',
          source:'ExchangeRate-API',
          base:'PLN',
          rates
        };

        return true;

      }

    }

  } catch(e) {}

  return false;

}


async function loadLiveWeather_() {

  const url =
    'https://api.open-meteo.com/v1/forecast' +
    '?latitude=-8.6500' +
    '&longitude=115.2167' +
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
    '&forecast_days=2' +
    '&timezone=Asia%2FMakassar';

  try {

    const data =
      await fetchJson_(
        url,
        7500
      );

    if (
      !data ||
      !data.current ||
      !data.daily
    ) {
      return false;
    }

    const currentCode =
      weatherCodeInfoClient_(
        data.current.weather_code
      );

    const tomorrowCode =
      weatherCodeInfoClient_(
        data.daily.weather_code
          ? data.daily.weather_code[1]
          : null
      );

    APP.weather = {

      location:
        'Bali · Denpasar',

      updatedAt:
        data.current.time || '',

      current: {

        temperature:
          Number(
            data.current.temperature_2m
          ),

        feelsLike:
          Number(
            data.current.apparent_temperature
          ),

        humidity:
          Number(
            data.current.relative_humidity_2m
          ),

        wind:
          Number(
            data.current.wind_speed_10m
          ),

        label:
          currentCode.label,

        icon:
          currentCode.icon

      },

      tomorrow: {

        date:
          data.daily.time
            ? data.daily.time[1]
            : '',

        min:
          data.daily.temperature_2m_min
            ? Number(
                data.daily.temperature_2m_min[1]
              )
            : null,

        max:
          data.daily.temperature_2m_max
            ? Number(
                data.daily.temperature_2m_max[1]
              )
            : null,

        rainProbability:
          data.daily.precipitation_probability_max
            ? Number(
                data.daily.precipitation_probability_max[1]
              )
            : null,

        label:
          tomorrowCode.label,

        icon:
          tomorrowCode.icon

      },

      source:
        'Open-Meteo'

    };

    return true;

  } catch(e) {

    return false;

  }

}


async function loadPublishedLiveData_() {

  try {

    const data =
      await fetchJson_(
        './live-data.json?ts=' +
        Date.now(),
        4500
      );

    if (!data) {
      return false;
    }

    let changed = false;

    const publishedRates =
      data.currencyRates &&
      data.currencyRates.rates
        ? data.currencyRates.rates
        : {};

    if (
      publishedRates.IDR &&
      publishedRates.EUR &&
      publishedRates.USD
    ) {
      APP.currencyRates =
        data.currencyRates;

      changed = true;
    }

    if (
      data.weather &&
      data.weather.current &&
      data.weather.tomorrow
    ) {
      APP.weather =
        data.weather;

      changed = true;
    }

    return changed;

  } catch(e) {

    return false;

  }

}


async function hydrateLiveExternalData_() {

  // Najpierw czytamy ten sam origin co PWA. Dane są odświeżane
  // przez GitHub Actions, więc iOS nie musi korzystać z CORS ani
  // czekać na zewnętrzne API.
  let changed =
    await loadPublishedLiveData_();

  const rates =
    APP.currencyRates &&
    APP.currencyRates.rates
      ? APP.currencyRates.rates
      : {};

  const needsCurrency =
    !rates.IDR ||
    !rates.EUR ||
    !rates.USD;

  const needsWeather =
    !APP.weather ||
    !APP.weather.current ||
    !APP.weather.tomorrow;

  const jobs = [];

  // Bezpośrednie źródła zostają jako dodatkowy fallback.
  if (needsCurrency) {
    jobs.push(
      loadLiveCurrency_()
    );
  }

  if (needsWeather) {
    jobs.push(
      loadLiveWeather_()
    );
  }

  if (!jobs.length) {
    return changed;
  }

  const results =
    await Promise.allSettled(
      jobs
    );

  if (
    results.some(
      result =>
        result.status === 'fulfilled' &&
        result.value === true
    )
  ) {
    changed = true;
  }

  return changed;

}

function saveOfflineSnapshot_() {
  try {
    const snapshot={
      savedAt:new Date().toISOString(),
      data:APP
    };

    localStorage.setItem(
      OFFLINE_KEY,
      JSON.stringify(snapshot)
    );

    // Jeśli aplikacja działa wewnątrz instalowalnej powłoki PWA,
    // przekazujemy jej bezpieczną kopię danych do prawdziwego trybu offline.
    // W samodzielnej PWA snapshot pozostaje w localStorage tego urządzenia.

  } catch(e) {}
}

function loadOfflineSnapshot_() {
  try {
    const raw=localStorage.getItem(OFFLINE_KEY);
    if(!raw) return null;
    const parsed=JSON.parse(raw);
    return parsed && parsed.data ? parsed : null;
  } catch(e) {
    return null;
  }
}

async function reloadData() {

  const cached =
    loadOfflineSnapshot_();

  let hadCachedData = false;

  if (
    cached &&
    cached.data
  ) {

    APP =
      cached.data;

    APP.documents =
      APP.documents || [];

    APP.places =
      APP.places || [];

    APP.emergency =
      APP.emergency || [];

    APP.costs =
      APP.costs || [];

    APP_OFFLINE = false;

    hadCachedData = true;

    document
      .getElementById('subtitle')
      .textContent =
        'Ostatni zapis · odświeżam dane…';

    // Najpierw pokazujemy ostatnią znaną wersję.
    // Dzięki temu aplikacja wygląda na natychmiastową.
    render();

  } else {

    // Nigdy nie zastępujemy całej aplikacji ekranem ładowania.
    // Od pierwszej klatki renderujemy normalny, klikalny interfejs,
    // a dane z Google Sheets uzupełniają go asynchronicznie.
    document
      .getElementById('subtitle')
      .textContent =
        'Prywatna aplikacja · pobieram świeże dane…';

    render();

  }

  try {

    // Szybki pakiet startowy:
    // plan + checklista + podstawowe informacje.
    const initial =
      await api(
        'getInitialAppData'
      );

    APP =
      Object.assign(
        {},
        APP,
        initial,
        {
          documents:
            APP.documents || [],
          places:
            APP.places || [],
          emergency:
            APP.emergency || [],
          costs:
            APP.costs || []
        }
      );

    APP_OFFLINE = false;

    document
      .getElementById('subtitle')
      .textContent =
        'Prywatna aplikacja' +
        (APP.accessPerson
          ? ' · ' + APP.accessPerson
          : '') +
        ' · aktualizuję szczegóły…';

    // Krytyczne dane już są — użytkownik może korzystać z appki.
    render();

    // Reszta ładuje się w tle równolegle.
    const deferredPromise =
      api('getDeferredAppData');

    const livePromise =
      hydrateLiveExternalData_();

    const results =
      await Promise.allSettled([
        deferredPromise,
        livePromise
      ]);

    const deferredResult =
      results[0];

    if (
      deferredResult.status ===
      'fulfilled'
    ) {

      const deferredData =
        deferredResult.value || {};

      // Nie pozwalamy, żeby awaryjna odpowiedź backendu
      // (np. tylko PLN albo null pogody) nadpisała poprawne
      // dane pobrane równolegle bezpośrednio w przeglądarce.
      const currentRates =
        APP.currencyRates &&
        APP.currencyRates.rates
          ? APP.currencyRates.rates
          : {};

      const backendRates =
        deferredData.currencyRates &&
        deferredData.currencyRates.rates
          ? deferredData.currencyRates.rates
          : {};

      const currentRatesOk =
        Boolean(
          currentRates.IDR &&
          currentRates.EUR &&
          currentRates.USD
        );

      const backendRatesOk =
        Boolean(
          backendRates.IDR &&
          backendRates.EUR &&
          backendRates.USD
        );

      const currentWeather =
        APP.weather;

      const currentWeatherOk =
        Boolean(
          currentWeather &&
          currentWeather.current &&
          currentWeather.tomorrow
        );

      const backendWeatherOk =
        Boolean(
          deferredData.weather &&
          deferredData.weather.current &&
          deferredData.weather.tomorrow
        );

      APP =
        Object.assign(
          {},
          APP,
          deferredData
        );

      if (
        currentRatesOk &&
        !backendRatesOk
      ) {
        APP.currencyRates =
          {
            ...APP.currencyRates,
            rates:currentRates
          };
      }

      if (
        currentWeatherOk &&
        !backendWeatherOk
      ) {
        APP.weather =
          currentWeather;
      }

      APP.documents =
        APP.documents || [];

      APP.places =
        APP.places || [];

      APP.emergency =
        APP.emergency || [];

      APP.costs =
        APP.costs || [];

    }

    saveOfflineSnapshot_();

    document
      .getElementById('subtitle')
      .textContent =
        'Prywatna aplikacja' +
        (APP.accessPerson
          ? ' · ' + APP.accessPerson
          : '') +
        ' · dane aktualne';

    render();

  } catch(e) {

    if (
      hadCachedData
    ) {

      APP_OFFLINE = true;

      document
        .getElementById('subtitle')
        .textContent =
          'Ostatni zapis · nie udało się odświeżyć';

      render();

      return;

    }

    const cachedAfterError =
      loadOfflineSnapshot_();

    if (
      cachedAfterError &&
      cachedAfterError.data
    ) {

      APP =
        cachedAfterError.data;

      APP.documents =
        APP.documents || [];

      APP.places =
        APP.places || [];

      APP.emergency =
        APP.emergency || [];

      APP.costs =
        APP.costs || [];

      APP_OFFLINE = true;

      const saved =
        cachedAfterError.savedAt
          ? new Date(
              cachedAfterError.savedAt
            )
            .toLocaleString('pl-PL')
          : '';

      document
        .getElementById('subtitle')
        .textContent =
          'Tryb offline' +
          (saved
            ? ' · dane z ' + saved
            : '');

      render();

      return;

    }

    document
      .getElementById('content')
      .innerHTML =
        `<div class="card">
          <b>Nie udało się wczytać danych.</b>
          <p class="muted">${esc(e.message)}</p>
          <div class="actions">
            <button class="btn" type="button" onclick="reloadData()">Spróbuj ponownie</button>
            <button class="btn ghost" type="button" onclick="resetBackendConnection_()">Napraw połączenie</button>
          </div>
        </div>`;

  }

}

function baliTodayIso() {

  try {

    return new Intl.DateTimeFormat(
      'en-CA',
      {
        timeZone:'Asia/Makassar',
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    ).format(new Date());

  } catch(e) {

    return new Date()
      .toISOString()
      .slice(0,10);

  }

}


function dayStatus() {

  const today = baliTodayIso();

  const sorted =
    APP.trip.filter(x => x.isoDate);

  if (!sorted.length) {
    return {
      mode:'none'
    };
  }

  const first =
    sorted[0].isoDate;

  const last =
    sorted[sorted.length - 1].isoDate;


  if (today < first) {

    const days = Math.ceil(
      (
        new Date(first + 'T00:00:00') -
        new Date(today + 'T00:00:00')
      ) / 86400000
    );

    return {
      mode:'before',
      day:sorted[0],
      days
    };

  }


  if (today > last) {

    return {
      mode:'after',
      day:sorted[sorted.length - 1]
    };

  }


  const exact =
    sorted.find(
      x => x.isoDate === today
    );


  return {

    mode:'during',

    day:
      exact ||
      sorted.find(
        x => x.isoDate > today
      ) ||
      sorted[sorted.length - 1]

  };

}

function safeExternalUrl_(value) {
  try {
    const u=new URL(String(value || '').trim());
    if(u.protocol === 'https:' || u.protocol === 'http:') return u.href;
  } catch(e) {}
  return '';
}

function phoneDigits_(value) {
  return String(value || '')
    .replace(/[^0-9+]/g,'')
    .replace(/^00/,'+');
}

function extractPhone_(text) {
  const match=String(text || '').match(/(?:\+?\d[\d\s().-]{6,}\d)/);
  return match ? match[0] : '';
}

function whatsappUrl_(phone) {
  const raw=phoneDigits_(phone).replace(/\+/g,'');
  return raw ? 'https://wa.me/' + encodeURIComponent(raw) : '';
}

function googleMapsSearchUrl_(query) {
  return 'https://www.google.com/maps/search/?api=1&query=' +
    encodeURIComponent(String(query || '').trim());
}

function googleMapsToHotelUrl_(day) {
  const destination=day.hotelAddress || day.hotel;
  if(!destination) return '';
  return 'https://www.google.com/maps/dir/?api=1&destination=' +
    encodeURIComponent(destination);
}

function googleMapsDayRouteUrl_(day) {
  const raw=String(day.routeText || '').trim();
  if(!raw) return '';

  const stops=raw.split('→').map(x=>x.trim()).filter(Boolean);
  if(stops.length < 2) return googleMapsSearchUrl_(raw);

  const origin=stops[0];
  const destination=stops[stops.length-1];
  const waypoints=stops.slice(1,-1).slice(0,8).join('|');

  let url='https://www.google.com/maps/dir/?api=1' +
    '&origin=' + encodeURIComponent(origin) +
    '&destination=' + encodeURIComponent(destination);

  if(waypoints){
    url += '&waypoints=' + encodeURIComponent(waypoints);
  }

  return url;
}

function setupPlanObserver() {

  if (planObserver) {
    planObserver.disconnect();
  }

  if (
    !('IntersectionObserver' in window)
  ) {
    return;
  }

  planObserver =
    new IntersectionObserver(
      entries => {

        const visible =
          entries
            .filter(
              x =>
                x.isIntersecting
            )
            .sort(
              (a,b) =>
                a.boundingClientRect.top -
                b.boundingClientRect.top
            );

        if (!visible.length) {
          return;
        }

        const day =
          visible[0]
            .target
            .dataset
            .planDay;

        setPlanActive(
          day,
          true
        );

      },
      {
        root:null,
        rootMargin:'-34% 0px -56% 0px',
        threshold:0
      }
    );


  document
    .querySelectorAll(
      '[data-plan-day]'
    )
    .forEach(
      el =>
        planObserver.observe(el)
    );

}

function formatAmount(amount, currency) {

  const n =
    Number(amount || 0);

  try {

    return new Intl.NumberFormat(
      'pl-PL',
      {
        maximumFractionDigits:
          currency === 'IDR'
            ? 0
            : 2
      }
    ).format(n) +
    ' ' +
    currency;

  } catch(e) {

    return n +
      ' ' +
      currency;

  }

}


function convertToPln(amount, currency) {

  const n =
    Number(amount || 0);

  if (currency === 'PLN') {
    return n;
  }

  const rates =
    APP.currencyRates?.rates || {};

  const r =
    rates[currency];

  if (
    !r ||
    !r.rate
  ) {
    return null;
  }

  return (
    n /
    Number(r.rate)
  );

}


function plnLabel(value) {

  if (
    value === null ||
    !Number.isFinite(
      Number(value)
    )
  ) {
    return 'brak kursu';
  }

  return new Intl.NumberFormat(
    'pl-PL',
    {
      style:'currency',
      currency:'PLN',
      maximumFractionDigits:2
    }
  ).format(
    Number(value)
  );

}

function renderCosts() {
  const costs=APP.costs || [];

  const knownPln=costs
    .map(x=>convertToPln(x.amount,x.currency))
    .filter(x=>x !== null && Number.isFinite(Number(x)));

  const total=knownPln.reduce((a,b)=>a+Number(b),0);

  const perPerson=costs
    .map(x=>{
      const pln=convertToPln(x.amount,x.currency);
      if(pln === null || !Number.isFinite(Number(pln))) return null;
      return Number(pln) / Math.max(1,Number(x.people || 2));
    })
    .filter(x=>x !== null && Number.isFinite(Number(x)))
    .reduce((a,b)=>a+Number(b),0);

  const hotelPln=costs
    .filter(x=>String(x.category).trim().toLowerCase()==='nocleg')
    .map(x=>convertToPln(x.amount,x.currency))
    .filter(x=>x !== null && Number.isFinite(Number(x)))
    .reduce((a,b)=>a+Number(b),0);

  const flightPln=costs
    .filter(x=>['lot','loty'].includes(String(x.category).trim().toLowerCase()))
    .map(x=>convertToPln(x.amount,x.currency))
    .filter(x=>x !== null && Number.isFinite(Number(x)))
    .reduce((a,b)=>a+Number(b),0);

  const byDay={};

  costs.forEach(item=>{
    const day=String(item.day || '').trim();
    if(!day) return;

    const pln=convertToPln(item.amount,item.currency);
    if(pln === null || !Number.isFinite(Number(pln))) return;

    if(!byDay[day]) byDay[day]={total:0,perPerson:0};

    byDay[day].total += Number(pln);
    byDay[day].perPerson += Number(pln) / Math.max(1,Number(item.people || 2));
  });

  const dailyRows=Object.keys(byDay)
    .sort((a,b)=>Number(a)-Number(b))
    .map(day=>`<div class="day-cost">
      <b>Dzień ${esc(day)}</b>
      <span>${plnLabel(byDay[day].total)} · /os. ${plnLabel(byDay[day].perPerson)}</span>

    .join('');

  const rateDate=APP.currencyRates?.date || '';

  document.getElementById('content').innerHTML = `
    <div class="hero">
      <div class="eyebrow">Budżet podróży</div>
      <div class="money-total">${plnLabel(total)}</div>
      <div class="travel-summary">
        <div class="info-tile"><span class="muted">Na osobę</span><strong>${plnLabel(perPerson)}</strong></div>
        <div class="info-tile"><span class="muted">Noclegi</span><strong>${plnLabel(hotelPln)}</strong></div>
        <div class="info-tile"><span class="muted">Loty</span><strong>${plnLabel(flightPln)}</strong></div>
      </div>
      <p>
        ${costs.length} zapisanych pozycji.
        ${rateDate ? ' Kursy walut aktualizują się automatycznie.' : ' Kursy walut są pobierane automatycznie.'}
      </p>
    </div>

    <h3 class="section-title">Wydatki dzienne</h3>
    <div class="card">
      ${dailyRows || '<div class="empty">Przy nowych wydatkach wybierz dzień podróży — podsumowanie pojawi się tutaj.</div>'}
    </div>

    <h3 class="section-title">Wszystkie koszty</h3>
    <div class="card">
      ${costs.length ? costs.map(costRow).join('') : '<div class="empty">Brak kosztów.</div>'}
    </div>

    <button class="btn" style="width:100%;margin-bottom:18px" onclick="addCostModal()">＋ Dodaj koszt</button>

    <h3 class="section-title">Przelicznik walut</h3>
    <div class="card">
      <div class="two-fields">

          <label>Kwota</label>
          <input id="convAmount" type="number" inputmode="decimal" value="100000" oninput="updateConverter()">
        </div>
        <div class="field">
          <label>Mam w</label>
          <select id="convCurrency" onchange="updateConverter()">
            <option value="IDR" selected>IDR — rupia Bali</option>
            <option value="PLN">PLN — złoty</option>
            <option value="EUR">EUR — euro</option>
            <option value="USD">USD — dolar</option>
          </select>
        </div>
      </div>
      <div class="converter-result" id="convResult">—</div>
      <div class="checkmeta" style="margin-top:10px">
        Przelicznik pokazuje równowartość jednocześnie w IDR, PLN, EUR i USD.
      </div>
    </div>`;

  updateConverter();
}

function convertFromPln(pln, currency) {

  const n =
    Number(pln || 0);

  if (currency === 'PLN') {
    return n;
  }

  const rates =
    APP.currencyRates?.rates || {};

  const r =
    rates[currency];

  if (
    !r ||
    !r.rate
  ) {
    return null;
  }

  return (
    n *
    Number(r.rate)
  );

}


function convertCurrency(
  amount,
  fromCurrency,
  toCurrency
) {

  if (
    String(fromCurrency) ===
    String(toCurrency)
  ) {
    return Number(amount || 0);
  }

  const pln =
    convertToPln(
      amount,
      fromCurrency
    );

  if (pln === null) {
    return null;
  }

  return convertFromPln(
    pln,
    toCurrency
  );

}


function currencyValueLabel(
  value,
  currency
) {

  if (
    value === null ||
    !Number.isFinite(
      Number(value)
    )
  ) {
    return 'brak kursu';
  }

  return new Intl.NumberFormat(
    'pl-PL',
    {
      maximumFractionDigits:
        currency === 'IDR'
          ? 0
          : 2
    }
  ).format(
    Number(value)
  );

}


function updateConverter() {

  const amountEl =
    document
      .getElementById(
        'convAmount'
      );

  const currencyEl =
    document
      .getElementById(
        'convCurrency'
      );

  const resultEl =
    document
      .getElementById(
        'convResult'
      );

  if (
    !amountEl ||
    !currencyEl ||
    !resultEl
  ) {
    return;
  }

  const amount =
    Number(
      amountEl.value || 0
    );

  const from =
    currencyEl.value;

  const codes =
    [
      ['IDR','Rupie Bali'],
      ['PLN','Złote'],
      ['EUR','Euro'],
      ['USD','Dolary']
    ];

  resultEl.innerHTML =
    '<div class="conversion-grid">' +
    codes
      .map(
        x => {

          const code =
            x[0];

          const label =
            x[1];

          const value =
            convertCurrency(
              amount,
              from,
              code
            );

          return `
            <div class="conversion-box">
              <div class="conversion-code">
                ${esc(code)} · ${esc(label)}
              </div>
              <div class="conversion-value">
                ${currencyValueLabel(value, code)}
              </div>
            </div>`;

        }
      )
      .join('') +
    '</div>';

}

async function saveNewEmergency() {

  const type=document.getElementById('newEmergencyType').value.trim();

function showModal(html) {

    .getElementById('modal')
    .classList.remove('show');

}

function editDayExtras(dayNumber) {
  const day=APP.trip.find(x=>String(x.day)===String(dayNumber));
  if(!day) return;

  showModal(
    `<h2>Dzień ${esc(dayNumber)} · szczegóły</h2>

      <div class="field">
        <label>Notatka dnia</label>
        <textarea id="dayNoteText" placeholder="Zmiana planu, co warto pamiętać, co odpuściliśmy…">${esc(day.dayNote || '')}</textarea>
      </div>

      <div class="field">
        <label>Adres noclegu</label>
        <textarea id="hotelAddressText" placeholder="Pełny adres noclegu">${esc(day.hotelAddress || '')}</textarea>
      </div>

      <div class="field">
        <label>WhatsApp kierowcy / transferu</label>
        <input id="transferWhatsappText" type="tel" placeholder="+62 …" value="${esc(day.transferWhatsapp || '')}">
      </div>

      <div class="field">
        <label>Trasa dnia</label>
        <textarea id="dayRouteText" placeholder="Punkt 1 → Punkt 2 → Punkt 3">${esc(day.routeText || '')}</textarea>
      </div>

      <div class="actions">
        <button class="btn" onclick="saveDayExtras('${esc(dayNumber)}')">Zapisz</button>
        <button class="btn ghost" onclick="closeModal()">Anuluj</button>
      </div>`
  );
}

async function saveDayExtras(dayNumber) {
  const note=document.getElementById('dayNoteText').value.trim();
  const address=document.getElementById('hotelAddressText').value.trim();
  const whatsapp=document.getElementById('transferWhatsappText').value.trim();
  const route=document.getElementById('dayRouteText').value.trim();

  try {
    await Promise.all([
      api('saveDayNote',dayNumber,note),
      api('saveHotelAddress',dayNumber,address),
      api('saveTransferWhatsapp',dayNumber,whatsapp),
      api('saveDayRoute',dayNumber,route)
    ]);

    const day=APP.trip.find(x=>String(x.day)===String(dayNumber));
    if(day){
      day.dayNote=note;
      day.hotelAddress=address;
      day.transferWhatsapp=whatsapp;
      day.routeText=route;
    }

    saveOfflineSnapshot_();
    closeModal();
    render();
  } catch(e) {
    alert('Nie udało się zapisać szczegółów dnia: ' + e.message);
  }
}

function editTransfer(dayNumber) {

  const day =
    APP.trip.find(
      x =>
        String(x.day) ===
        String(dayNumber)
    );


  showModal(

    `<h2>
      Transport · dzień ${esc(dayNumber)}

    <div class="field">

      <label>

      </label>

        id="transferText"

      </button>


      <button
        class="btn ghost"
        onclick="closeModal()">

        Anuluj

      </button>

    </div>`

  );

}


async function saveTransfer(dayNumber) {

  const text =
    document
      .getElementById('transferText')
      .value
      .trim();


  try {

    await api(
      'saveTransfer',
      dayNumber,
      text
    );


    const day =
      APP.trip.find(
        x =>
          String(x.day) ===
          String(dayNumber)
      );


    if (day) {
      day.transfer = text;
    }


    closeModal();

    render();

  }

  catch(e) {

    alert(
      e.message
    );

  }

}


function checklistCategoryOptions() {

  const defaults =
    [
      'Przed wyjazdem',
      'Transport',
      'Atrakcje',
      'Przewodnik',
      'Łodzie',
      'Nusa Penida',
      'Surfing',
      'Dokumenty',
      'Telefon',
      'Noclegi',
      'Jedzenie',
      'Inne'
    ];

  const existing =
    (APP.checklist || [])
      .map(
        x =>
          String(
            x.category || ''
          ).trim()
      )
      .filter(Boolean);

  const categories =
    [
      ...new Set(
        [
          ...existing,
          ...defaults
        ]
      )
    ];

  return categories
    .map(
      category =>
        `<option
          value="${esc(category)}"
          ${category === 'Inne' ? 'selected' : ''}>
          ${esc(category)}
        </option>`
    )
    .join('');

}
